<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/pos :: head('Kết thúc ca')}"></head>
<body class="pos-app">
<a class="skip" href="#main-content">Đến nội dung chính</a>
<div class="frame cashier-shell">
  <aside th:replace="~{layout/pos :: sidebar}"></aside>
  <button class="nav-scrim" type="button" data-close-menu aria-label="Đóng menu"></button>
  <div class="workspace">
    <header th:replace="~{layout/pos :: header}"></header>
    <main tabindex="-1" class="page narrow" id="main-content" data-current-page="shifts">
      <div class="pagehead">
        <div><p class="eyebrow" th:text="${closing.shiftNo}"></p><h1>Kết thúc ca</h1>
          <p>Nhập tiền mặt kiểm đếm để xem và xác nhận kết quả bàn giao.</p></div>
        <a class="btn" th:href="@{/shifts}">Quay lại ca làm việc</a>
      </div>
      <div th:replace="~{layout/pos :: feedback}"></div>
      <section class="card">
        <h2>Số liệu ca đang mở</h2>
        <dl th:replace="~{pos/shift-close-confirm :: figures}"></dl>
        <p class="muted">Tiền chuyển khoản và tiền thừa không cộng vào tiền mặt dự kiến.</p>
        <form th:action="@{/shifts/close}" th:object="${closingForm}" method="post" class="formgrid">
          <div class="field span2">
            <label for="actualCash">Tiền mặt thực tế kiểm đếm (VNĐ)</label>
            <input id="actualCash" th:field="*{actualCash}" type="number" min="0" step="1"
                   max="9999999999999999" required aria-describedby="actual-cash-error"
                   th:attr="aria-invalid=${#fields.hasErrors('actualCash')}">
            <p id="actual-cash-error" class="notice danger" role="alert"
               th:if="${#fields.hasErrors('actualCash')}" th:errors="*{actualCash}"></p>
          </div>
          <div class="span2 actions">
            <a class="btn" th:href="@{/shifts}">Chưa kết thúc</a>
            <button class="btn primary" type="submit">Xem số liệu xác nhận</button>
          </div>
        </form>
      </section>
    </main>
  </div>
</div>
<th:block th:replace="~{layout/pos :: dialogs}"></th:block>
</body>
</html>
