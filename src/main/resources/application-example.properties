# Copy to application-local.properties and activate the local profile.
# Supply credentials through the environment; never commit real passwords.
spring.datasource.url=${POS_DB_URL}
spring.datasource.username=${POS_DB_USERNAME}
spring.datasource.password=${POS_DB_PASSWORD}
# Example URL: jdbc:mysql://localhost:3306/pos?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Enable secure session cookies when served over HTTPS:
# server.servlet.session.cookie.secure=true

# SHOP bank details for manual transfer confirmation. Empty values disable transfers.
pos.transfer.bank-bin=
pos.transfer.account-number=
pos.transfer.account-name=
