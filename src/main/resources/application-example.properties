# Copy to application-local.properties and activate the local profile.
# Use an isolated local database with database/schema.sql and database/seed.sql applied explicitly.
# Example POS_DB_URL: jdbc:mysql://localhost:3306/pos_test?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
spring.datasource.url=${POS_DB_URL}
spring.datasource.username=${POS_DB_USER}
spring.datasource.password=${POS_DB_PASSWORD}
