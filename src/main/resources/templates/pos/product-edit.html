<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/pos :: head('Sửa sản phẩm')}"></head>
<body class="pos-app">
<a class="skip" href="#main-content">Đến nội dung chính</a>
<div class="frame">
  <aside th:replace="~{layout/pos :: sidebar}"></aside>
  <button class="nav-scrim" type="button" data-close-menu aria-label="Đóng menu"></button>
  <div class="workspace">
    <header th:replace="~{layout/pos :: header}"></header>
    <main class="page narrow" id="main-content" tabindex="-1" data-current-page="products">
      <div class="pagehead"><div><p class="eyebrow" th:text="${product.code}"></p><h1>Sửa sản phẩm</h1><p>Cập nhật thông tin danh mục và giá bán hiện tại.</p></div><a class="btn" th:href="@{/products}">Danh sách sản phẩm</a></div>
      <div th:replace="~{layout/pos :: feedback}"></div>
      <section class="card">
        <form method="post" th:action="@{/products/{id}(id=${product.id})}" th:object="${form}" class="formgrid">
          <input type="hidden" th:field="*{expectedUpdatedAt}">
          <p class="field-error span2" th:errors="*{expectedUpdatedAt}"></p>
          <div class="field span2"><label for="barcode">Mã vạch *</label><input th:field="*{barcode}" maxlength="50" required><p class="field-error" th:errors="*{barcode}"></p></div>
          <div class="field span2"><label for="name">Tên sản phẩm *</label><input th:field="*{name}" maxlength="200" required><p class="field-error" th:errors="*{name}"></p></div>
          <div class="field"><label for="categoryId">Nhóm hàng *</label><select th:field="*{categoryId}" required><option value="">Chọn nhóm hàng đang hoạt động</option><option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option></select><p class="field-error" th:errors="*{categoryId}"></p></div>
          <div class="field"><label for="unitId">Đơn vị *</label><select th:field="*{unitId}" th:disabled="${product.unit_locked}" required><option value="">Chọn đơn vị</option><option th:each="u : ${units}" th:value="${u.id}" th:text="${u.name}"></option></select><input th:if="${product.unit_locked}" type="hidden" name="unitId" th:value="${product.unit_id}"><small class="muted" th:if="${product.unit_locked}">Sản phẩm đã có lịch sử, đơn vị được giữ nguyên.</small><p class="field-error" th:errors="*{unitId}"></p></div>
          <div class="field"><label for="price">Đơn giá (VNĐ) *</label><input type="number" th:field="*{price}" min="1" step="1" max="9999999999999999" required><p class="field-error" th:errors="*{price}"></p></div>
          <div class="field"><label for="stock">Tồn kho *</label><input type="number" th:field="*{stock}" min="0" step="0.001" max="999999999999.999" required><small class="muted" th:text="'Đang giữ cho giao dịch: ' + ${product.reserved_quantity.stripTrailingZeros().toPlainString()}"></small><p class="field-error" th:errors="*{stock}"></p></div>
          <div class="field span2"><label for="imageUrl">Ảnh sản phẩm (URL HTTPS)</label><input type="url" th:field="*{imageUrl}" maxlength="500" placeholder="https://..."><p class="field-error" th:errors="*{imageUrl}"></p></div>
          <p class="muted span2">Giá và thông tin trên hóa đơn đã lập được giữ nguyên. Giao dịch mới sử dụng thông tin mới sau khi lưu.</p>
          <div class="actions span2"><button class="btn primary" type="submit">Lưu thay đổi</button><a class="btn" th:href="@{/products}">Hủy</a><a class="btn" th:href="@{/products/{id}/edit(id=${product.id})}">Tải lại dữ liệu</a></div>
        </form>
      </section>
    </main>
  </div>
</div>
<th:block th:replace="~{layout/pos :: dialogs}"></th:block>
</body></html>
