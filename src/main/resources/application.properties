spring.application.name=pos-supermarket
server.port=8080
spring.datasource.url=${POS_DB_URL:jdbc:mysql://localhost:3306/pos_supermarket?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${POS_DB_USERNAME:pos_app}
spring.datasource.password=${POS_DB_PASSWORD:}
spring.sql.init.mode=never
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
